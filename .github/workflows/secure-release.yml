name: Secure Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare fresh report directory
        run: |
          rm -rf reports
          mkdir -p reports

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip
          python -m pip install semgrep

      # Use the upstream release archive rather than assuming Go is present or
      # that its GOPATH will be persisted between workflow steps.
      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: "8.24.2"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf /tmp/gitleaks.tar.gz -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # setup-trivy failed on the hosted runner; install the same pinned
      # upstream archive directly so the workflow has no nested-action setup.
      - name: Install Trivy
        env:
          # v0.68.2 has been removed from the upstream release assets.
          TRIVY_VERSION: "0.75.0"
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output /tmp/trivy.tar.gz
          mkdir -p "$RUNNER_TEMP/trivy"
          tar -xzf /tmp/trivy.tar.gz -C "$RUNNER_TEMP/trivy" trivy
          chmod +x "$RUNNER_TEMP/trivy/trivy"
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"

      - name: Display scanner versions
        run: |
          command -v semgrep
          command -v trivy
          command -v gitleaks
          semgrep --version
          trivy --version
          gitleaks version

      # The agent retains raw JSON only when a scanner actually produced it.
      # It records missing executables, invalid JSON, and database/network failures
      # as FAILED, which the policy blocks for required scanners.
      - name: Run unified security scan and generate release reports
        id: agent
        continue-on-error: true
        run: python -m engine.agent --scan --target .

      - name: Generate Trivy CycloneDX SBOM
        if: always()
        continue-on-error: true
        run: trivy fs --format cyclonedx --output reports/sbom.cdx.json .

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-release-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce release policy
        if: always()
        run: |
          test -s reports/release-report.json
          python -m engine.gate
