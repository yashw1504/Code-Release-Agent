
name: Legacy Semgrep Security Scan

on: workflow_dispatch

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Display Semgrep version
        run: semgrep --version

      - name: Create reports directory
        run: mkdir -p reports

      # --------------------------------------------------
      # 1. Run Semgrep
      # --------------------------------------------------
      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          set +e

          semgrep scan \
            --config p/security-audit \
            --include '*.py' \
            --no-git-ignore \
            --verbose \
            --json \
            --output reports/semgrep.json \
            .

          scan_exit=$?
          echo "scan_exit_code=$scan_exit" >> "$GITHUB_OUTPUT"

          if [ ! -s reports/semgrep.json ]; then
            echo "ERROR: Semgrep report is missing or empty."
            exit 1
          fi

          exit "$scan_exit"

      # --------------------------------------------------
      # 2. Validate Semgrep JSON
      # --------------------------------------------------
      - name: Validate Semgrep JSON
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/semgrep.json")

          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("ERROR: Report missing or empty.")

          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: Invalid JSON: {exc}")

          if not isinstance(report, dict):
              raise SystemExit("ERROR: Expected a JSON object.")

          results = report.get("results")
          errors = report.get("errors")
          scanned = report.get("paths", {}).get("scanned", [])

          if not isinstance(results, list):
              raise SystemExit("ERROR: Missing results list.")

          if not isinstance(errors, list):
              raise SystemExit("ERROR: Invalid errors field.")

          print("Semgrep version:", report.get("version"))
          print("Findings:", len(results))
          print("Errors:", len(errors))
          print("Scanned paths:", len(scanned))
          print("Bytes scanned:", report.get("total_bytes", "unknown"))

          if errors:
              for error in errors:
                  print("Semgrep error:", error)
              raise SystemExit("ERROR: Semgrep reported scanner errors.")

          if not scanned:
              raise SystemExit("ERROR: No scanned paths reported.")

          print("Semgrep JSON validation passed.")
          PY

      # --------------------------------------------------
      # 3. Generate human-readable Semgrep HTML report
      # --------------------------------------------------
      - name: Generate Semgrep HTML report
        id: semgrep_html
        if: steps.semgrep.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          python scripts/semgrep_to_html.py
          test -s reports/semgrep.html

          echo "Semgrep HTML report generated."

      # --------------------------------------------------
      # 4. Generate agent JSON and HTML reports
      # --------------------------------------------------
      - name: Generate Release Reports
        id: release_report
        if: steps.semgrep_html.outcome == 'success'
        run: |
          python -m engine.agent reports/semgrep.json

          test -s reports/release-report.json
          test -s reports/release-report.html

          echo "Release JSON and HTML reports generated."

      # --------------------------------------------------
      # 5. Evaluate release gate
      # --------------------------------------------------
      - name: Evaluate Release Gate
        id: gate
        if: steps.release_report.outcome == 'success'
        continue-on-error: true
        run: |
          python -m engine.gate

      # --------------------------------------------------
      # 6. Upload reports even when the gate blocks release
      # --------------------------------------------------
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-release-reports
          path: |
            reports/semgrep.json
            reports/semgrep.html
            reports/release-report.json
            reports/release-report.html
          if-no-files-found: warn
          retention-days: 7

      # --------------------------------------------------
      # 7. Enforce final pipeline result
      # --------------------------------------------------
      - name: Enforce Scan and Release Policy
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
          SEMGREP_HTML_OUTCOME: ${{ steps.semgrep_html.outcome }}
          REPORT_OUTCOME: ${{ steps.release_report.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "FAILED: Semgrep scan did not complete successfully."
            exit 1
          fi

          if [ "$VALIDATION_OUTCOME" != "success" ]; then
            echo "FAILED: Semgrep JSON validation failed."
            exit 1
          fi

          if [ "$SEMGREP_HTML_OUTCOME" != "success" ]; then
            echo "FAILED: Semgrep HTML report generation failed."
            exit 1
          fi

          if [ "$REPORT_OUTCOME" != "success" ]; then
            echo "FAILED: Release report generation failed."
            exit 1
          fi

          if [ "$GATE_OUTCOME" != "success" ]; then
            echo "FAILED: Release gate blocked or rejected the release."
            exit 1
          fi

          echo "PASS: Scan, reports, and release gate succeeded."
