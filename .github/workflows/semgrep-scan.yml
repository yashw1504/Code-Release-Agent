
name: Semgrep Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Scan and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Display Semgrep version
        run: semgrep --version

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Semgrep scan
        id: semgrep
        continue-on-error: true
        run: |
          set +e
          semgrep scan \
            --config p/security-audit \
            --include '*.py' \
            --no-git-ignore \
            --verbose \
            --json \
            --output reports/semgrep.json \
            .
          scan_exit=$?
          echo "scan_exit_code=$scan_exit" >> "$GITHUB_OUTPUT"

          if [ ! -s reports/semgrep.json ]; then
            echo "ERROR: Missing or empty Semgrep report."
            exit 1
          fi

          # Semgrep can return nonzero for findings or operational errors.
          # Report validation and scan status are evaluated separately.
          exit "$scan_exit"

      - name: Validate Semgrep JSON
        id: validate
        if: always()
        continue-on-error: true
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("reports/semgrep.json")

          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit("ERROR: Report missing or empty.")

          try:
              report = json.loads(path.read_text(encoding="utf-8"))
          except json.JSONDecodeError as exc:
              raise SystemExit(f"ERROR: Invalid JSON: {exc}")

          if not isinstance(report, dict):
              raise SystemExit("ERROR: Expected a JSON object.")

          results = report.get("results")
          errors = report.get("errors")
          scanned = report.get("paths", {}).get("scanned", [])

          if not isinstance(results, list):
              raise SystemExit("ERROR: Missing results list.")

          if not isinstance(errors, list):
              raise SystemExit("ERROR: Invalid errors field.")

          print("Semgrep version:", report.get("version"))
          print("Findings:", len(results))
          print("Errors:", len(errors))
          print("Scanned paths:", len(scanned))
          print("Bytes scanned:", report.get("total_bytes", "unknown"))

          if errors:
              for error in errors:
                  print("Semgrep error:", error)
              raise SystemExit("ERROR: Semgrep reported scan errors.")

          if not scanned:
              raise SystemExit("ERROR: No scanned paths reported.")

          print("Semgrep JSON validation passed.")
          PY

    
      - name: Generate JSON and HTML release reports
        id: release_report
        if: steps.semgrep.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          python -m engine.agent reports/semgrep.json

          test -s reports/release-report.json
          test -s reports/release-report.html

          echo "Both release reports generated successfully."


      
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secure-release-reports
          path: |
            reports/semgrep.json
            reports/release-report.json
            reports/release-report.html
          if-no-files-found: warn
          retention-days: 7


      - name: Enforce scan success
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.semgrep.outcome }}
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          if [ "$SCAN_OUTCOME" != "success" ]; then
            echo "FAILED: Semgrep scan did not complete successfully."
            exit 1
          fi

          if [ "$VALIDATION_OUTCOME" != "success" ]; then
            echo "FAILED: Semgrep report validation failed."
            exit 1
          fi

          echo "Semgrep scan and validation succeeded."


          