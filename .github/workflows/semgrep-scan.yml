name: Semgrep Security Scan

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  semgrep:
    name: Run Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Create reports directory
        run: mkdir -p reports

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config p/security-audit \
            --json \
            --output reports/semgrep.json \
            .

      - name: Generate HTML Report
        if: always()
        run: |
          cat > reports/release-report.html << 'EOF'
          <html>
          <head>
            <title>Semgrep Report</title>
            <style>
              body {
                font-family: Arial, sans-serif;
                margin: 20px;
              }
              pre {
                background: #f5f5f5;
                padding: 10px;
                border-radius: 5px;
                overflow-x: auto;
              }
            </style>
          </head>
          <body>
            <h1>Semgrep Security Report</h1>
            <pre>
          EOF

          cat reports/semgrep.json >> reports/release-report.html

          cat >> reports/release-report.html << 'EOF'
            </pre>
          </body>
          </html>
          EOF

      - name: Validate JSON report
        if: always()
        run: |
          if [ -f reports/semgrep.json ]; then
            python -m json.tool reports/semgrep.json > /dev/null
            echo "Semgrep JSON report is valid."
          else
            echo "Semgrep report was not generated."
            exit 1
          fi

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-report
          path: |
            reports/semgrep.json
            reports/release-report.html
          retention-days: 7